<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiny Todo</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app">

    <script type="module" src="/app.js"></script>

</html>
